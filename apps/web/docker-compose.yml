services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: friends-mc-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_PATH: /data/auth.sqlite
      MODPACK_PATH: /packs/Friends-MC.mrpack
      MINECRAFT_LOG_PATH: /minecraft-logs/latest.log
    volumes:
      - auth_data:/data
      - ${MODPACK_FILE:?Set MODPACK_FILE in .env}:/packs/Friends-MC.mrpack:ro
      - ${MINECRAFT_LOG_DIR:-/srv/minecraft/aeronautics/data/logs}:/minecraft-logs:ro
    networks:
      - default
      - minecraft_bridge
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    container_name: friends-mc-portal
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  auth_data:
  caddy_data:
    external: true
    name: portal_caddy_data
  caddy_config:
    external: true
    name: portal_caddy_config

networks:
  minecraft_bridge:
    external: true
    name: friends_mc_bridge
